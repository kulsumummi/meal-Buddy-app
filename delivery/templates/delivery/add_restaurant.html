<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant - Meal Buddy Admin</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    
    .form-card {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 50px 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
    }
    
    .form-card h1 {
        font-size: 2rem;
        margin-bottom: 10px;
    }
    
    .form-card p {
        color: #3a3a3a;
        margin-bottom: 30px;
        font-size: 14px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        margin-top: 0;
        margin-bottom: 10px;
    }
    
    .form-group input {
        width: 100%;
    }
    
    .form-card button {
        width: 100%;
        margin-top: 30px;
        margin-bottom: 0;
    }
</style>
</head>
<body>
    <div class="form-container">
        <form class="form-card" action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}
            <h1>Add Restaurant</h1>
            <p>Create a new restaurant profile on Meal Buddy</p>
            
            <div class="form-group">
                <label>Restaurant Name</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Picture URL</label>
                <input type="text" name="picture" required placeholder="https://example.com/image.jpg">
            </div>
            
            <div class="form-group">
                <label>Cuisine Type</label>
                <input type="text" name="cuisine" required placeholder="e.g., Italian, Chinese, Indian">
            </div>
            
            <div class="form-group">
                <label>Rating (0-5)</label>
                <input type="number" name="rating" min="0" max="5" step="0.5" required>
            </div>
            
            <button type="submit">Add Restaurant</button>
        </form>
    </div>
</body>
</html>
