<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Restaurants - Meal Buddy Admin</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .restaurants-container {
        max-width: 1200px;
        margin: 40px auto;
    }
    
    .restaurants-header {
        margin-bottom: 40px;
        text-align: center;
    }
    
    .restaurants-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }
    
    .restaurants-table-wrapper {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 35px;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
        overflow-x: auto;
    }
    
    .restaurants-table-wrapper table {
        margin-top: 0;
    }
    
    .action-links {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .action-links a {
        padding: 8px 14px;
        font-size: 13px;
        border-radius: 12px;
    }
</style>
</head>
<body>
    <div class="restaurants-container">
        <div class="restaurants-header">
            <h1>🏪 Manage Restaurants</h1>
            <p style="color: #2c2c2c; font-size: 15px;">View and manage all your restaurants</p>
        </div>
        
        <div class="restaurants-table-wrapper">
            <table border="0">
                <thead>
                    <tr>
                        <th>Restaurant Name</th>
                        <th>Image</th>
                        <th>Cuisine</th>
                        <th>Rating</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {%  for r in restaurantList %}
                        <tr>
                            <td><strong>{{ r.name }}</strong></td>
                            <td style="text-align: center;">
                                <img src="{{ r.picture }}" style="width: 80px; height: 60px;">
                            </td>
                            <td>{{ r.cuisine }}</td>
                            <td>⭐ {{ r.rating }}</td>
                            <td>
                                <div class="action-links">
                                    <a href="{% url 'open_update_restaurant' r.id %}" style="background: linear-gradient(135deg, #ff6b35 0%, #ff8656 100%);">
                                        Edit Info
                                    </a>
                                    <a href="{% url 'open_update_menu' r.id %}" style="background: rgba(255,255,255,0.18); border: 1px solid rgba(0,0,0,0.12); color: #1f1f1f;">
                                        Update Menu
                                    </a>
                                    <a href="{% url 'delete_restaurant' r.id %}" style="background: rgba(255,50,50,0.2); color: #ff6666;">
                                        Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    
</body>
</html>
