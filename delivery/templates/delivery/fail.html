<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed - Meal Buddy</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .message-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
        padding: 60px 20px;
        min-height: 100vh;
    }
    
    .message-card {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 50px 40px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
        animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .message-icon {
        font-size: 3.5rem;
        margin-bottom: 20px;
    }
    
    .message-card h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #ff6666;
    }
    
    .message-card p {
        color: #2c2c2c;
        font-size: 15px;
        margin-bottom: 30px;
    }
    
    .message-card a {
        padding: 12px 30px;
        background: linear-gradient(135deg, #ff6b35 0%, #ff8656 100%);
        font-size: 15px;
    }
</style>
</head>
<body>
    <div class="message-container">
        <div class="message-card">
            <div class="message-icon">✕</div>
            <h1>Login Failed</h1>
            <p>Invalid username or password. Please try again.</p>
            <a href="{% url 'open_signin' %}">Try Again</a>
        </div>
    </div>
</body>
</html>
