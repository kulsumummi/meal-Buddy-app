<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In - Meal Buddy</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    
    .auth-form {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 50px 40px;
        max-width: 450px;
        width: 100%;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
    }
    
    .auth-form h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #1f1f1f;
    }
    
    .auth-form p {
        color: #3a3a3a;
        margin-bottom: 30px;
        font-size: 14px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        margin-top: 0;
        margin-bottom: 10px;
    }
    
    .form-group input {
        width: 100%;
    }
    
    .auth-form button {
        width: 100%;
        margin: 25px 0 0 0;
        padding: 14px 20px;
        font-size: 16px;
    }
    
    .auth-link {
        text-align: center;
        margin-top: 20px;
        color: #3a3a3a;
    }
    
    .auth-link a {
        color: #ff6b35;
        text-decoration: none;
        font-weight: 600;
        margin: 0;
        display: inline;
        padding: 0;
        background: none;
        box-shadow: none;
    }
    
    .auth-link a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" action="{% url 'signin' %}" method="post">
            {% csrf_token %}
            <h1>Welcome Back</h1>
            <p>Sign in to your account to continue ordering</p>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            
            <button type="submit">Sign In</button>
            
            <div class="auth-link">
                Don't have an account? <a href="{% url 'open_signup' %}">Sign Up</a>
            </div>
        </form>
    </div>

</body>
</html>
