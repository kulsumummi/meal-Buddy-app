<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu - Meal Buddy Admin</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .menu-manager {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
    }
    
    .menu-section {
        margin-bottom: 60px;
    }
    
    .menu-section h2 {
        font-size: 1.8rem;
        margin-bottom: 30px;
        text-align: left;
    }
    
    .items-table-wrapper {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 35px;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
        overflow-x: auto;
        margin-bottom: 40px;
    }
    
    .items-table-wrapper table {
        margin-top: 0;
    }
    
    .add-item-form {
        background: rgba(255,255,255,0.22);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        padding: 40px;
        box-shadow: 0 18px 48px rgba(0,0,0,0.14), 0 3px 12px rgba(0,0,0,0.06);
        max-width: 600px;
    }
    
    .add-item-form h3 {
        font-size: 1.5rem;
        margin-bottom: 25px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        margin-top: 0;
        margin-bottom: 10px;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
    }
    
    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .checkbox-group input {
        width: auto;
    }
    
    .checkbox-group label {
        margin: 0;
        margin-bottom: 0 !important;
    }
    
    .add-item-form button {
        width: 100%;
        margin-top: 25px;
    }
</style>
</head>
<body>
    <div class="menu-manager">
        
        <div class="menu-section">
            <h2>📋 Current Menu Items</h2>
            
            <div class="items-table-wrapper">
                <table border="0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Image</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        {%  for item in itemList %}
                            <tr>
                                <td><strong>{{ item.name }}</strong></td>
                                <td style="text-align: center;">
                                    <img src="{{ item.picture }}" style="width: 80px; height: 60px;">
                                </td>
                                <td style="color: #3a3a3a; font-size: 14px;">{{ item.description|truncatewords:8 }}</td>
                                <td style="color: #ffb347; font-weight: 700;">₹{{ item.price }}</td>
                                <td>
                                    {% if item.vegeterian %}
                                        <span class="veg">🟢 Veg</span>
                                    {% else %}
                                        <span class="nonveg">🔴 Non Veg</span>
                                    {% endif %}
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="menu-section">
            <h2>➕ Add New Item</h2>
            
            <form class="add-item-form" action="{% url 'update_menu' restaurant.id %}" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" required></textarea>
                </div>

                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" name="price" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" name="picture" required>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="vegeterian" name="vegeterian">
                        <label for="vegeterian">Vegetarian Item</label>
                    </div>
                </div>

                <button type="submit">Add Item to Menu</button>
            </form>
        </div>
    </div>
</body>
</html>
